# Identifiants MySQL lus dans les variables d'environnement (jamais dans le code) :
#   DB_URL (optionnel), DB_USERNAME, DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alertcom}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8086
spring.jpa.properties.hibernate.ejb.entitymanager_factory_name=AlertCommuneApplication
logging.level.org.springframework.web=DEBUG